name: Build VectorFM

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain and logue SDK
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('build.sh') }}

      - name: Build unit (Arm GCC 10.3-2021.10, same as Korg's SDK)
        run: ./build.sh
        env:
          VFM_TOOLCHAIN: arm

      # Korg's own example oscillator built with the same toolchain: a known-good
      # unit for checking KORG KONTROL Editor / hardware issues.
      - name: Build Korg "waves" example for comparison
        run: |
          make -C .deps/logue-sdk/platform/nts-1_mkii/waves install \
            GCC_BIN_PATH="$PWD/.deps/gcc-arm-none-eabi-10.3-2021.10/bin" INSTALLDIR="$PWD/dist"

      - name: Run DSP tests
        run: ./test/run.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: VectorFM-nts1mkii
          path: |
            dist/*.nts1mkiiunit
            test/out/*.wav

      - name: Read unit version from header.c
        id: ver
        run: |
          hex=$(grep -oE '\.version = 0x[0-9A-Fa-f]+' vectorfm/header.c | grep -oE '0x[0-9A-Fa-f]+')
          v=$(( hex ))
          tag="v$(( (v >> 16) & 0xFF )).$(( (v >> 8) & 0xFF )).$(( v & 0xFF ))"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Unit version $tag"

      # New version on main -> new Release. Re-runs of an existing version just update its file.
      - name: Publish release
        if: >-
          github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') ||
          (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VectorFM ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || steps.ver.outputs.tag }}
          make_latest: true
          files: dist/VectorFM.nts1mkiiunit
          body: |
            VectorFM oscillator for the Korg NTS-1 digital kit mkII.

            **Install:** download `VectorFM.nts1mkiiunit` below, open KORG KONTROL Editor with the NTS-1 mkII connected, drag the file onto the **oscillator** list and press **SEND**.

            Controls and test checklist: see the [README](https://github.com/${{ github.repository }}#readme).
